<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F3F4F1">
    <meta name="description" content="Escuta: registro de humor e rotina, padrões emocionais e acesso a profissionais de saúde mental. Projeto FMU, ODS 3.">
    <title>Escuta: monitoramento de saúde mental</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
  /* =========================================================
   1. TOKENS
   ========================================================= */
  :root {
    --bg: #F3F4F1;
    --surface: #FFFFFF;
    --surface-2: #EBEEE8;
    --ink: #1E2A2E;
    --muted: #56646A;
    --line: #D9DED7;
    --primary: #2E4A6B;
    --primary-soft: #E2E9F1;
    --on-primary: #FFFFFF;
    --bem: #A87A10;
    --bem-fill: #EBC66A;
    --mal: #45659C;
    --mal-fill: #94ACD6;
    --ajuda: #AE3550;
    --ajuda-fill: #DE7C92;
    --ok: #2C7656;
    --ok-soft: #DFF0E7;
    --warn: #9A6200;
    --warn-soft: #FBEFD6;
    --bad: #AE3550;
    --bad-soft: #F8E3E7;
    --focus: #2F63E0;
    --shadow: 0 1px 2px rgba(30, 42, 46, .05), 0 8px 22px rgba(30, 42, 46, .06);
    --header-bg: rgba(243, 244, 241, .9);
    --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-serif: "Newsreader", Georgia, "Times New Roman", serif;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151C;
      --surface: #18202A;
      --surface-2: #212B37;
      --ink: #E6EBF0;
      --muted: #9BA8B5;
      --line: #2C3746;
      --primary: #93B7E0;
      --primary-soft: #1E3048;
      --on-primary: #0C1624;
      --bem: #E6C36A;
      --bem-fill: #C9A24B;
      --mal: #9DB5E0;
      --mal-fill: #6F8BBE;
      --ajuda: #F08DA2;
      --ajuda-fill: #C9607A;
      --ok: #6FD3A6;
      --ok-soft: #163328;
      --warn: #F2BE5C;
      --warn-soft: #382B12;
      --bad: #F08DA2;
      --bad-soft: #3A1D25;
      --focus: #8FB0FF;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .3);
      --header-bg: rgba(16, 21, 28, .88);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151C;
    --surface: #18202A;
    --surface-2: #212B37;
    --ink: #E6EBF0;
    --muted: #9BA8B5;
    --line: #2C3746;
    --primary: #93B7E0;
    --primary-soft: #1E3048;
    --on-primary: #0C1624;
    --bem: #E6C36A;
    --bem-fill: #C9A24B;
    --mal: #9DB5E0;
    --mal-fill: #6F8BBE;
    --ajuda: #F08DA2;
    --ajuda-fill: #C9607A;
    --ok: #6FD3A6;
    --ok-soft: #163328;
    --warn: #F2BE5C;
    --warn-soft: #382B12;
    --bad: #F08DA2;
    --bad-soft: #3A1D25;
    --focus: #8FB0FF;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 26px rgba(0, 0, 0, .3);
    --header-bg: rgba(16, 21, 28, .88);
    color-scheme: dark;
  }

  /* =========================================================
   2. BASE
   ========================================================= */
  *,
  *::before,
  *::after {
    box-sizing: border-box
  }

  html {
    height: 100%;
    scroll-padding-top: env(safe-area-inset-top, 0px)
  }

  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    z-index: 10;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px)
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
    color: inherit
  }

  a {
    color: inherit
  }

  :focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: 2px;
    border-radius: 8px
  }

  h1,
  h2,
  h3 {
    margin: 0;
    line-height: 1.15
  }

  h1,
  .serif {
    font-family: var(--font-serif);
    font-weight: 500;
    letter-spacing: -.01em
  }

  h2 {
    font-size: 1.1rem;
    font-weight: 600
  }

  .icon {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    flex: none
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap
  }

  .muted {
    color: var(--muted)
  }

  /* =========================================================
   3. CABEÇALHO, NAVEGAÇÃO E BOTÃO DE AJUDA
   ========================================================= */
  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line)
  }

  .topbar-inner {
    max-width: 1120px;
    margin: 0 auto;
    padding: 10px 18px;
    display: flex;
    align-items: center;
    gap: 10px
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    margin-right: auto
  }

  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--primary);
    color: var(--on-primary);
    display: grid;
    place-items: center
  }

  .brand b {
    font-family: var(--font-serif);
    font-size: 1.45rem;
    font-weight: 600;
    line-height: 1
  }

  .brand small {
    display: block;
    font-size: .72rem;
    color: var(--muted);
    margin-top: 2px
  }

  .nav {
    display: flex;
    gap: 2px
  }

  .nav a {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 11px;
    border-radius: 10px;
    text-decoration: none;
    color: var(--muted);
    font-weight: 500;
    font-size: .92rem;
    position: relative
  }

  .nav a:hover {
    background: var(--surface-2);
    color: var(--ink)
  }

  .nav a[aria-current="page"] {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600
  }

  .nav .badge {
    position: absolute;
    top: 3px;
    right: 4px;
    min-width: 17px;
    height: 17px;
    border-radius: 9px;
    background: var(--bad);
    color: #fff;
    font-size: .68rem;
    display: grid;
    place-items: center;
    padding: 0 4px
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 7px 11px 7px 9px;
    cursor: pointer;
    font-size: .86rem
  }

  .help-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 0;
    background: var(--ajuda);
    color: #fff;
    border-radius: 999px;
    padding: 8px 14px 8px 11px;
    cursor: pointer;
    font-weight: 600;
    font-size: .9rem;
    text-decoration: none
  }

  :root[data-theme="dark"] .help-btn {
    color: #1A0A10
  }

  @media (prefers-color-scheme:dark) {
    :root:not([data-theme="light"]) .help-btn {
      color: #1A0A10
    }
  }

  @media (max-width:940px) {
    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      background: var(--surface);
      border-top: 1px solid var(--line);
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
      display: grid;
      grid-template-columns: repeat(5, 1fr)
    }

    .nav a {
      flex-direction: column;
      gap: 2px;
      font-size: .7rem;
      padding: 7px 2px;
      text-align: center
    }

    .nav .badge {
      right: calc(50% - 22px)
    }

    .pill span,
    .brand small,
    .hide-sm {
      display: none
    }

    .pill {
      padding: 8px
    }
  }

  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 20px 18px calc(110px + env(safe-area-inset-bottom, 0px))
  }

  @media (min-width:941px) {
    main {
      padding-bottom: 48px
    }
  }

  /* =========================================================
   4. COMPONENTES
   ========================================================= */
  .page-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 18px
  }

  .page-head h1 {
    font-size: 2.1rem
  }

  .page-head p {
    margin: 4px 0 0;
    color: var(--muted);
    max-width: 68ch
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px
  }

  .card h2 {
    margin-bottom: 12px
  }

  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap
  }

  .card-head h2 {
    margin: 0
  }

  .stack {
    display: grid;
    gap: 14px
  }

  .cols {
    display: grid;
    gap: 16px
  }

  @media (min-width:940px) {
    .cols {
      grid-template-columns: 1.5fr 1fr;
      align-items: start
    }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 11px;
    padding: 9px 14px;
    cursor: pointer;
    font-weight: 500;
    font-size: .93rem;
    text-decoration: none;
    line-height: 1.2
  }

  .btn:hover {
    border-color: var(--muted)
  }

  .btn:disabled {
    opacity: .45;
    cursor: not-allowed
  }

  .btn .icon {
    width: 18px;
    height: 18px
  }

  .btn-primary {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--on-primary)
  }

  .btn-primary:hover {
    border-color: var(--primary);
    filter: brightness(1.08)
  }

  .btn-ghost {
    background: transparent;
    border-color: transparent;
    color: var(--muted)
  }

  .btn-ghost:hover {
    background: var(--surface-2);
    border-color: transparent
  }

  .btn-danger {
    color: var(--bad)
  }

  .btn-sm {
    padding: 6px 10px;
    font-size: .85rem;
    border-radius: 9px
  }

  .seg {
    display: inline-flex;
    flex-wrap: wrap;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 3px;
    gap: 2px
  }

  .seg button {
    border: 0;
    background: transparent;
    border-radius: 9px;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 500;
    color: var(--muted);
    font-size: .9rem
  }

  .seg button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: var(--shadow)
  }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px
  }

  .chip {
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 999px;
    padding: 5px 12px;
    cursor: pointer;
    font-size: .88rem
  }

  .chip[aria-pressed="true"] {
    background: var(--primary-soft);
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 600
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    border-radius: 999px;
    padding: 2px 9px;
    font-size: .78rem;
    font-weight: 600;
    white-space: nowrap
  }

  .tag .icon {
    width: 14px;
    height: 14px
  }

  .t-ok {
    background: var(--ok-soft);
    color: var(--ok)
  }

  .t-warn {
    background: var(--warn-soft);
    color: var(--warn)
  }

  .t-bad {
    background: var(--bad-soft);
    color: var(--bad)
  }

  .t-info {
    background: var(--primary-soft);
    color: var(--primary)
  }

  .t-mute {
    background: var(--surface-2);
    color: var(--muted)
  }

  .field label,
  .field .lbl {
    display: block;
    font-weight: 500;
    font-size: .9rem;
    margin-bottom: 5px
  }

  .field small {
    display: block;
    color: var(--muted);
    font-size: .82rem;
    margin-top: 4px
  }

  .field input:not([type=checkbox]):not([type=range]),
  .field select,
  .field textarea {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 10px;
    padding: 10px 11px
  }

  .field textarea {
    min-height: 80px;
    resize: vertical
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    border-color: var(--primary);
    outline: none
  }

  .field .err {
    display: none;
    color: var(--bad);
    font-size: .84rem;
    margin-top: 4px
  }

  .field.invalid input,
  .field.invalid select {
    border-color: var(--bad)
  }

  .field.invalid .err {
    display: block
  }

  .row {
    display: grid;
    gap: 12px;
    grid-template-columns: 1fr 1fr
  }

  @media (max-width:560px) {
    .row {
      grid-template-columns: 1fr
    }
  }

  .range {
    display: flex;
    align-items: center;
    gap: 10px
  }

  .range input {
    flex: 1;
    accent-color: var(--primary)
  }

  .range output {
    min-width: 56px;
    text-align: right;
    font-weight: 600
  }

  .check {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    cursor: pointer;
    font-size: .93rem
  }

  .check input {
    width: 18px;
    height: 18px;
    margin-top: 3px;
    accent-color: var(--primary);
    flex: none
  }

  .notice {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--surface-2);
    border-radius: 12px;
    padding: 11px 13px;
    font-size: .9rem;
    color: var(--muted)
  }

  .notice .icon {
    width: 18px;
    height: 18px;
    color: var(--primary);
    margin-top: 2px
  }

  .empty {
    text-align: center;
    padding: 24px 14px;
    color: var(--muted);
    border: 1.5px dashed var(--line);
    border-radius: 14px
  }

  .empty b {
    display: block;
    color: var(--ink);
    margin-bottom: 4px
  }

  .empty .btn {
    margin-top: 10px
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .9rem
  }

  th,
  td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top
  }

  th {
    color: var(--muted);
    font-weight: 500;
    font-size: .82rem
  }

  .table-wrap {
    overflow-x: auto
  }

  .toast-zone {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    z-index: 70;
    display: grid;
    gap: 8px;
    width: min(92vw, 440px)
  }

  .toast {
    background: var(--ink);
    color: var(--bg);
    padding: 11px 15px;
    border-radius: 12px;
    font-size: .92rem;
    box-shadow: var(--shadow)
  }

  dialog {
    border: 0;
    padding: 0;
    background: transparent;
    color: var(--ink);
    width: min(560px, 100vw);
    max-height: 100%
  }

  dialog::backdrop {
    background: rgba(10, 14, 20, .55)
  }

  .sheet {
    background: var(--surface);
    border-radius: 22px;
    padding: 20px;
    max-height: calc(100dvh - 40px);
    overflow: auto
  }

  .sheet-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px
  }

  .sheet-head h2 {
    font-family: var(--font-serif);
    font-size: 1.5rem;
    font-weight: 500
  }

  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    display: grid;
    place-items: center;
    cursor: pointer
  }

  .sheet-foot {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    flex-wrap: wrap;
    margin-top: 16px
  }

  @media (max-width:600px) {
    dialog {
      margin: auto 0 0;
      width: 100vw;
      max-width: 100vw
    }

    .sheet {
      border-radius: 22px 22px 0 0;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      max-height: 92dvh
    }
  }

  /* =========================================================
   5. REGISTRO DE HUMOR E FAIXA DO HUMOR
   ========================================================= */
  .greet h1 {
    font-size: 2.5rem
  }

  .greet p {
    margin: 6px 0 0;
    color: var(--muted)
  }

  .ribbon-wrap {
    margin: 18px 0 22px
  }

  .ribbon {
    display: flex;
    gap: 3px;
    height: 46px
  }

  .ribbon i {
    flex: 1;
    border-radius: 6px;
    background: var(--surface-2);
    position: relative
  }

  .ribbon i.bem {
    background: var(--bem-fill)
  }

  .ribbon i.mal {
    background: var(--mal-fill)
  }

  .ribbon i.ajuda {
    background: var(--ajuda-fill)
  }

  .ribbon i.hoje {
    outline: 2px solid var(--ink);
    outline-offset: 2px
  }

  .ribbon-legend {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    font-size: .82rem;
    color: var(--muted);
    margin-top: 8px
  }

  .legend {
    display: flex;
    gap: 14px;
    flex-wrap: wrap
  }

  .legend span {
    display: inline-flex;
    align-items: center;
    gap: 6px
  }

  .legend i {
    width: 12px;
    height: 12px;
    border-radius: 3px
  }

  .moods {
    display: grid;
    gap: 12px
  }

  @media (min-width:760px) {
    .moods {
      grid-template-columns: 1fr 1fr 1.15fr
    }
  }

  .mood {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: flex-start;
    text-align: left;
    border: 1.5px solid var(--line);
    background: var(--surface);
    border-radius: 20px;
    padding: 18px;
    cursor: pointer;
    min-height: 132px
  }

  .mood:hover {
    border-color: var(--mc)
  }

  .mood .mi {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: color-mix(in srgb, var(--mf) 35%, var(--surface));
    color: var(--mc)
  }

  .mood .mi .icon {
    width: 24px;
    height: 24px
  }

  .mood b {
    font-family: var(--font-serif);
    font-size: 1.4rem;
    font-weight: 500;
    line-height: 1.15
  }

  .mood span {
    color: var(--muted);
    font-size: .88rem
  }

  .mood.ajuda {
    background: color-mix(in srgb, var(--ajuda-fill) 14%, var(--surface));
    border-color: color-mix(in srgb, var(--ajuda) 35%, var(--line))
  }

  .mood[aria-pressed="true"] {
    border-color: var(--mc);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--mc) 25%, transparent)
  }

  .m-bem {
    --mc: var(--bem);
    --mf: var(--bem-fill)
  }

  .m-mal {
    --mc: var(--mal);
    --mf: var(--mal-fill)
  }

  .m-ajuda {
    --mc: var(--ajuda);
    --mf: var(--ajuda-fill)
  }

  .routine {
    display: grid;
    gap: 16px
  }

  @media (min-width:760px) {
    .routine {
      grid-template-columns: 1fr 1fr
    }
  }

  .scale {
    display: flex;
    gap: 6px
  }

  .scale button {
    flex: 1;
    border: 1.5px solid var(--line);
    background: var(--surface);

  async function hashSenha(senha, sal) {
    const txt = sal + ":" + senha;
    if (window.crypto && crypto.subtle) {
      try {
        const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
        return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
      } catch (e) {}
    }
    let h = 2166136261;
    for (const c of txt) {
      h ^= c.charCodeAt(0);
      h = Math.imul(h, 16777619);
    }
    return "fnv" + (h >>> 0).toString(16);
  }

  function validar(form, regras) {
    form.querySelectorAll(".field").forEach(f => f.classList.remove("invalid"));

    regras.forEach(([nome, ok]) => {
      if (!ok) {
        const el = form.elements[nome];
        el.closest(".field").classList.add("invalid");
        primeiro = primeiro || el;
      }
    });
    primeiro && primeiro.focus();
    return !primeiro;

  function faixa(regs, dias = 30) {
    const m = humorDoDia(regs),

    const m = humorDoDia(regs);
    let n = 0;
    for (let i = 0; i < 400; i++) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const h = m[ymd(d)];
      if (i === 0 && !h) continue;
      if (h === "bem") n++;

  }

  /* Padrões: regras simples e transparentes. Não são diagnóstico. */
  function padroes(u) {
    const r7 = registrosDe(u, 7),
      r30 = registrosDe(u, 30),
      out = [];
    const d7 = humorDoDia(r7),
      dias7 = Object.values(d7),
      mal7 = dias7.filter(h => h !== "bem").length;
    const ajuda14 = registrosDe(u, 14).some(r => r.humor === "ajuda");
    if (ajuda14) out.push({
      nivel: "cuidado",
      titulo: "Você pediu ajuda nas últimas duas semanas",
      texto: "Manter um acompanhamento profissional pode fazer diferença. Os contatos de apoio continuam sempre no botão “Preciso de ajuda”.",
      regra: "Existe pelo menos um registro “Não estou bem, preciso de ajuda” nos últimos 14 dias.",
      acao: "cuidado"
    });
    if (mal7 >= 4) out.push({
      nivel: "atencao",
      titulo: `Dias difíceis em ${mal7} dos últimos 7`,
      texto: "Quando o mal-estar se repete por vários dias, conversar com um profissional ajuda a entender o que está acontecendo.",
      regra: "Quatro ou mais dias com “Não estou bem” ou pedido de ajuda nos últimos 7 dias.",
      acao: "cuidado"
    });
    const comSono = r30.filter(r => r.sono != null);
    const sB = media(comSono.filter(r => r.humor === "bem").map(r => r.sono)),
      sM = media(comSono.filter(r => r.humor !== "bem").map(r => r.sono));
    if (comSono.length >= 8 && sB - sM >= .8) out.push({
      nivel: "info",
      titulo: "Seu humor acompanha o sono",
      texto: `Nos dias em que você se sentiu bem, dormiu em média ${num(sB)} h. Nos outros, ${num(sM)} h.`,
      regra: "Diferença de pelo menos 48 minutos entre a média de sono dos dias bons e dos dias difíceis, nos últimos 30 dias, com 8 ou mais registros de sono."
    });
    const longos = r7.filter(r => r.trabalho >= 10).length;
    if (longos >= 3) out.push({
      nivel: "atencao",
      titulo: "Jornadas longas nesta semana",
      texto: `Você registrou 10 horas ou mais de trabalho ou estudo em ${longos} dias. Jornadas longas e frequentes estão associadas ao esgotamento.`,

    });
    const semContato = r7.filter(r => r.social === false).length;

    });
    return out;
  }

          bairro: "",

          presencial: false,
          plantao: false,
          abordagem: "",
          disp: {}

        tipo: tipoConta,
        id: base.id
      };

      rota();

  async function entrar(email, senha) {
    const u = DB.usuarios.find(x => x.email === email),
      p = DB.profissionais.find(x => x.email === email),
      c = u || p;
    if (!c || await hashSenha(senha, c.sal) !== c.senha) return false;
    DB.sessao = {
      tipo: u ? "u" : "p",
      id: c.id
    };
    salvarDB();
    location.hash = "";
    rota();
    return true;
  }

  function telaHistorico(app) {
    const u = eu(),
      P = ui.periodo,
      regs = registrosDe(u.id, P),
      dh = humorDoDia(regs),
      dias = Object.keys(dh).length;
    const cont = {
      bem: 0,
      mal: 0,
      ajuda: 0
    };
    Object.values(dh).forEach(h => cont[h]++);
    const semanas = [];
    const nS = Math.min(12, Math.ceil(P / 7));
    for (let w = nS - 1; w >= 0; w--) {
      const ini = new Date();
      ini.setHours(0, 0, 0, 0);
      ini.setDate(ini.getDate() - w * 7 - 6);
      const fim = new Date(ini);
      fim.setDate(fim.getDate() + 7);
      const c = {
        bem: 0,
        mal: 0,
        ajuda: 0
      };
      Object.entries(dh).forEach(([d, h]) => {
        const x = new Date(d + "T12:00");
        if (x >= ini && x < fim) c[h]++;
      });
      semanas.push({
        rot: fmtData(ini.toISOString()),
        ...c
      });
    }
    const maxS = Math.max(7, ...semanas.map(s => s.bem + s.mal + s.ajuda));
    const sonoPor = h => media(regs.filter(r => r.sono != null && (h === "bem" ? r.humor === "bem" : r.humor !== "bem")).map(r => r.sono));
    const trabPor = h => media(regs.filter(r => r.trabalho != null && (h === "bem" ? r.humor === "bem" : r.humor !== "bem")).map(r => r.trabalho));
    const sent = {};
    regs.forEach(r => r.sentimentos.forEach(s => sent[s] = (sent[s] || 0) + 1));
    const topS = Object.entries(sent).sort((a, b) => b[1] - a[1]).slice(0, 6),
      maxSent = topS[0]?.[1] || 1;
    const BONS = ["Calma", "Motivação", "Gratidão"];
    const cal = [];
    const inicio = new Date();
    inicio.setDate(inicio.getDate() - (Math.min(P, 35) - 1));
    for (let i = 0; i < inicio.getDay(); i++) cal.push(`<div class="d out"></div>`);
    for (let d = new Date(inicio); d <= new Date(); d.setDate(d.getDate() + 1)) {
      const k = ymd(d);
      cal.push(`<div class="d ${dh[k] || ""}" title="${d.toLocaleDateString("pt-BR")}">${d.getDate()}</div>`);
    }
    app.innerHTML = `
    <div class="page-head"><div><h1>Indicadores</h1><p>Seu histórico emocional e o que ele mostra. Os indicadores ajudam a perceber padrões; a avaliação é sempre de um profissional.</p></div>
      <div class="seg" role="group" aria-label="Período">${[7,30,90].map(n => `<button data-p="${n}" aria-pressed="${P===n}">${n} dias</button>`).join("")}</div></div>
        <div class="stats">
        <div class="stat"><small>Dias registrados</small><b>${dias}</b></div>
        <div class="stat"><small>Bem</small><b style="color:var(--bem)">${dias ? Math.round(cont.bem/dias*100) : 0}%</b></div>
      <div class="stat"><small>Não estou bem</small><b style="color:var(--mal)">${dias ? Math.round(cont.mal/dias*100) : 0}%</b></div>
      <div class="stat"><small>Pedidos de ajuda</small><b style="color:var(--ajuda)">${cont.ajuda}</b></div>
      </div>
      <div class="cols">
      <div class="stack">
      <section class="card"><div class="card-head"><h2>Dias por semana</h2>${legenda()}</div>
      <div class="bars" role="img" aria-label="Dias de cada humor por semana">${semanas.map(s => `<div class="bc"><div class="stackb">${["bem","mal","ajuda"].map(h => s[h] ? `<i style="height:${s[h]/maxS*100}%;background:var(--${h}-fill)" title="${HUMOR[h].curto}: ${s[h]}"></i>` : "").join("")}</div><small>${s.rot}</small></div>`).join("")}</div></section>
        <section class="card"><h2>Rotina nos dias bons e nos difíceis</h2>
          ${[["Sono médio", sonoPor, 12, "h"],["Trabalho ou estudo", trabPor, 16, "h"]].map(([r, f, max, un]) => `<p style="margin:10px 0 2px;font-weight:600;font-size:.92rem">${r}</p>
        <div class="hbar"><span>Dias bons</span><div class="tr"><i style="width:${(f("bem")||0)/max*100}%;background:var(--bem-fill)"></i></div><b>${num(f("bem"))} ${un}</b></div>
            <div class="hbar"><span>Dias difíceis</span><div class="tr"><i style="width:${(f("mal")||0)/max*100}%;background:var(--mal-fill)"></i></div><b>${num(f("mal"))} ${un}</b></div>`).join("")}
        </section>
        <section class="card"><h2>Sentimentos mais registrados</h2>
          ${topS.length ? topS.map(([s,n]) => `<div class="hbar"><span>${s}</span><div class="tr"><i style="width:${n/maxSent*100}%;background:${BONS.includes(s) ? "var(--bem-fill)" : "var(--mal-fill)"}"></i></div><b>${n}</b></div>`).join("") : `<p class="muted">Nenhum sentimento registrado no período.</p>`}</section>
      </div>
      <div class="stack">
        <section class="card"><h2>Calendário</h2><div class="calgrid">${DOW.map(d => `<span class="dow">${d[0]}</span>`).join("")}${cal.join("")}</div></section>
        <section class="card"><h2>Padrões observados</h2>${padroesHTML(padroes(u.id))}</section>
        <section class="card"><h2>Registros</h2>
          ${regs.slice(0, 12).map(r => `<div class="entry"><span class="dot" style="background:var(--${r.humor}-fill)"></span><div style="flex:1"><b>${HUMOR[r.humor].curto}</b> <span class="muted" style="font-size:.85rem">${fmtDH(r.em)}</span>
            <p>${[r.sono != null && `sono ${num(r.sono)} h`, r.trabalho != null && `trabalho ${num(r.trabalho)} h`, r.sentimentos.join(", ")].filter(Boolean).join("; ")}</p>${r.nota ? `<p style="color:var(--ink)">${esc(r.nota)}</p>` : ""}</div>
            <button class="btn btn-sm btn-ghost" data-del="${r.id}" aria-label="Excluir registro">${icon("trash")}</button></div>`).join("") || `<p class="muted">Sem registros no período.</p>`}</section>
      </div>
    </div>`;
    app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
      ui.periodo = +b.dataset.p;
      render();
    });
    app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => confirmar("Excluir registro?", "Ele sai do seu histórico e de qualquer acesso autorizado.", "Excluir", () => {
      DB.registros = DB.registros.filter(r => r.id !== b.dataset.del);
      salvarDB();
      render();
      toast("Registro excluído.");
    }));
  }

  function proximosHorarios(p, dias = 10) {
    const out = [],
      ocupados = new Set(DB.agendamentos.filter(a => a.pid === p.id && a.status === "confirmado").map(a => a.inicio.slice(0, 16)));
    for (let i = 0; i < dias; i++) {
      const d = new Date();
      d.setDate(d.getDate() + i);
      const hs = (p.disp[d.getDay()] || []).map(h => {
          const x = new Date(d);
          const [hh, mm] = h.split(":");
          x.setHours(+hh, +mm, 0, 0);
          return x;
        })
        .filter(x => x.getTime() > Date.now() + 3600e3 && !ocupados.has(x.toISOString().slice(0, 16)));
      if (hs.length) out.push({
        d,
        hs
      });
    }
    return out;
  }

  function telaConversas(app) {

    const nomeDe = id => souU ? proPorId(id)?.nome : userPorId(id)?.nome;
    const msgs = ui.thread ? DB.mensagens.filter(m => souU ? (m.uid === s.id && m.pid === ui.thread) : (m.pid === s.id && m.uid === ui.thread)).sort((a, b) => a.em.localeCompare(b.em)) : [];

    <div class="page-head"><div><h1>Conversas</h1><p>${souU ? "Mensagens com os profissionais que você escolheu." : "Mensagens com seus pacientes."}</p></div></div>
    ${ids.length ? `<div class="chat">
      <div class="threads">${ids.map(id => `<button class="thread" data-t="${id}" aria-current="${id===ui.thread}"><span class="avatar">${iniciais(nomeDe(id) || "?")}</span><span style="min-width:0"><b>${esc(nomeDe(id))}</b><small>${pares[id] ? esc(pares[id].texto) : "Nova conversa"}</small></span></button>`).join("")}</div>
      <section class="card">
        <div class="card-head"><h2>${esc(nomeDe(ui.thread))}</h2>${ag ? `<span class="tag t-info">${icon(ag.modalidade === "video" ? "video" : ag.modalidade === "ligacao" ? "phone" : "chat")} ${fmtDH(ag.inicio)}</span>` : ""}</div>
        <div class="msgs" id="msgs">${msgs.map(m => `<div class="msg ${m.de === "s" ? "sis" : (m.de === (souU ? "u" : "p") ? "eu" : "outro")}">${esc(m.texto)}<time>${fmtDH(m.em)}</time></div>`).join("") || `<p class="muted" style="text-align:center">Escreva a primeira mensagem.</p>`}</div>
        <div class="composer"><label class="sr-only" for="txt">Mensagem</label><textarea id="txt" rows="1" placeholder="Escreva uma mensagem"></textarea><button class="btn btn-primary" id="env" aria-label="Enviar">${icon("send")}</button></div>
        <p class="muted" style="font-size:.8rem;margin:8px 0 0">${souU ? "As respostas dependem da disponibilidade do profissional. Em emergência, ligue 188 ou 192." : "Ligação e videochamada usam um serviço de vídeo integrado na versão de produção."}</p>
      </section></div>`
    : `<div class="empty"><b>Nenhuma conversa ainda</b>${souU ? "Encontre um profissional em Cuidado e toque em Conversar." : "As mensagens dos pacientes aparecem aqui."}${souU ? `<br><a class="btn" href="#cuidado">${icon("people")} Ver profissionais</a>` : ""}</div>`}`;
    app.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
      ui.thread = b.dataset.t;
      render();
    });
    const box = app.querySelector("#msgs");
    if (box) box.scrollTop = box.scrollHeight;
    const txt = app.querySelector("#txt");
    if (txt) {
      const enviar = () => {
        const t = txt.value.trim();
        if (!t) return;
        DB.mensagens.push({
          id: uid(),
          uid: souU ? s.id : ui.thread,
          pid: souU ? ui.thread : s.id,
          de: souU ? "u" : "p",
          texto: t,
          em: new Date().toISOString()
        });
        if (!souU) DB.alertas.filter(a => a.pid === s.id && a.uid === ui.thread && !a.atendido).forEach(a => a.atendido = new Date().toISOString());
        salvarDB();
        render();
        document.getElementById("txt")?.focus();
      };
      app.querySelector("#env").onclick = enviar;
      txt.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          enviar();
        }
      });

      DB.registros = DB.registros.filter(r => r.uid !== u.id);

  let downloadsNS = null;
  if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(d => {
    downloadsNS = d;
  }).catch(() => {});
  async function exportarDados() {
    const u = eu(),
      {
        senha,
        sal,
        ...perfil
      } = u;
    const dados = {
      app: "Escuta",
      exportadoEm: new Date().toISOString(),
      perfil,
      registros: DB.registros.filter(r => r.uid === u.id),
      autorizacoes: DB.consentimentos.filter(c => c.uid === u.id).map(c => ({
        ...c,
        profissional: proPorId(c.pid)?.nome
      })),
      agendamentos: DB.agendamentos.filter(a => a.uid === u.id),
      mensagens: DB.mensagens.filter(m => m.uid === u.id),
      acessos: DB.auditoria.filter(a => a.alvo === u.id)
    };
    const blob = new Blob([JSON.stringify(dados, null, 2)], {
        type: "application/json"
      }),
      nome = `escuta-meus-dados-${hojeStr()}.json`;
    if (downloadsNS) {
      try {
        await downloadsNS.save({
          filename: nome,
          data: blob
        });
        toast("Arquivo salvo.");
      } catch (e) {
        toast(e && e.code === "declined" ? "Download cancelado." : "Não foi possível salvar o arquivo aqui.");
      }
      return;
    }
    const url = URL.createObjectURL(blob),
      a = document.createElement("a");
    a.href = url;
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  } < /section> <
  section class = "card" > < h2 > Padrões calculados pelo app < /h2>${c.rotina ? padroesHTML(padroes(u.id)) : `<p class="muted">A pessoa não compartilhou dados de rotina.</p > `}

    const p = eu();
    app.innerHTML = `
    <div class="page-head"><div><h1>Perfil profissional</h1><p>Estas informações aparecem para os usuários em Cuidado.</p></div></div>
    <div class="cols"><form class="card form stack" id="fp" novalidate>
      <div class="row"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" value="${esc(p.nome)}"><div class="err">Informe o nome.</div></div>
        <div class="field"><label for="profissao">Profissão</label><input id="profissao" name="profissao" value="${esc(p.profissao)}"></div></div>
      <div class="row"><div class="field"><label for="rede">Rede</label><select id="rede" name="rede">${Object.entries(REDE).map(([k,[r]]) => `<option value="${k}" ${p.rede===k?"selected":""}>${r}</option>`).join("")}</select></div>
        <div class="field"><label for="valor">Valor por sessão (R$)</label><input id="valor" name="valor" type="number" min="0" step="5" value="${p.valor}"><div class="err">Informe um valor válido.</div></div></div>
      <div class="row"><div class="field"><label for="cidade">Cidade</label><input id="cidade" name="cidade" value="${esc(p.cidade)}"></div><div class="field"><label for="bairro">Bairro</label><input id="bairro" name="bairro" value="${esc(p.bairro)}"></div></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap"><label class="check"><input type="checkbox" name="online" ${p.online ? "checked" : ""}> Atende online</label><label class="check"><input type="checkbox" name="presencial" ${p.presencial ? "checked" : ""}> Atende presencialmente</label></div>
      <div class="field"><label for="abordagem">Abordagem e foco</label><textarea id="abordagem" name="abordagem" maxlength="300">${esc(p.abordagem)}</textarea></div>
      <button class="btn btn-primary" type="submit">${icon("check")} Salvar perfil</button></form>
      <section class="card"><h2>Registro profissional</h2><p style="margin:0"><b>${p.conselho.tipo} ${p.conselho.uf}/${p.conselho.numero}</b></p>
        <p class="muted" style="font-size:.9rem">${p.verificado ? "Verificado." : "Em verificação."} Em produção, a verificação consulta o cadastro nacional do conselho (CFP ou CFM) antes de liberar o perfil.</p>
        ${!p.verificado ? `<button class="btn btn-sm" id="verif">Simular aprovação (demonstração)</button>` : ""}
        <div class="notice" style="margin-top:12px">${icon("info")}<span>Atendimentos online seguem as normas do seu conselho, como a Resolução CFP nº 11/2018 para psicólogos.</span></div></section></div>`;
    const f = app.querySelector("#fp"),
      el = f.elements;
    f.onsubmit = e => {
      e.preventDefault();
      if (!validar(f, [
          ["nome", el.nome.value.trim()],
          ["valor", el.valor.value !== "" && +el.valor.value >= 0]
        ])) return;
      Object.assign(p, {
        nome: el.nome.value.trim(),
        profissao: el.profissao.value.trim(),
        rede: el.rede.value,
        valor: +el.valor.value,
        cidade: el.cidade.value.trim(),
        bairro: el.bairro.value.trim(),
        online: el.online.checked,
        presencial: el.presencial.checked,
        abordagem: el.abordagem.value.trim()
      });
      salvarDB();
      toast("Perfil salvo.");
      render();
    };
    const v = app.querySelector("#verif");
    if (v) v.onclick = () => {
      p.verificado = true;
      salvarDB();
      render();
      toast("Registro verificado (simulação).");
    };
  }

  /* =========================================================
     O. LEMBRETE DIÁRIO E INICIALIZAÇÃO
     ========================================================= */
  let lembreteMostrado = "";
  setInterval(() => {
    if (!DB?.sessao || DB.sessao.tipo !== "u") return;
    const u = eu();
    if (!u?.lembrete) return;
    const agora = new Date(),
      [h, m] = u.lembrete.split(":").map(Number),
      hoje = hojeStr();
    if (agora.getHours() * 60 + agora.getMinutes() >= h * 60 + m && lembreteMostrado !== hoje && !DB.registros.some(r => r.uid === u.id && diaDe(r.em) === hoje)) {
      lembreteMostrado = hoje;
      if (!sheet.open) abrir("Como foi seu dia?", `<p style="margin-top:0">Leva menos de um minuto e ajuda você a perceber seus padrões.</p><div class="sheet-foot"><button class="btn" data-fechar>Depois</button><a class="btn btn-primary" href="#hoje" data-fechar>Registrar agora</a></div>`);
    }
  }, 30000);

  (async function iniciar() {
    aplicarTema();
    try {
      const v = JSON.parse(localStorage.getItem(DB_KEY));
      if (v && v.versao === 1) DB = Object.assign(vazioDB(), v);
    } catch (e) {}
    if (!DB) await semear();
    rota();
  })();
</script>
  </body>
</html>
